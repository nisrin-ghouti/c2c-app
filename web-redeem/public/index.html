<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>C2C — Redeem Benefit</title>
<style>
  :root {
    --brand-start: #C8A5F0;
    --brand-end: #94DEF5;
    --ink: #1D1333;
    --muted: #646073;
    --success: #61D19A;
    --destructive: #F16F78;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, var(--brand-start), var(--brand-end));
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    border-radius: 24px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(29, 19, 51, 0.25);
  }
  .accent-bar { height: 4px; border-radius: 999px; width: 48px; margin: 0 auto 16px; background: var(--brand-start); }
  .accent-bar.destructive { background: var(--destructive); }
  .accent-bar.muted { background: var(--muted); }
  .accent-bar.success { background: var(--success); }
  .emoji { font-size: 48px; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 19px; color: var(--ink); margin: 0 0 8px; }
  p { font-size: 14px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    background: linear-gradient(135deg, var(--brand-start), var(--brand-end));
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary {
    margin-top: 10px;
    background: none;
    color: var(--muted);
    border: 1px solid #E3E1EA;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="accent-bar"></div>
    <div class="emoji">⏳</div>
    <h1>Loading…</h1>
    <p>Checking this benefit code.</p>
  </div>

<script>
  const FUNCTION_BASE = "https://bsetdlehfsndjygqqaax.supabase.co/functions/v1/redeem-benefit";

  function tokenFromPath() {
    const segments = location.pathname.split("/").filter(Boolean);
    // Path is /r/<token>
    return segments[segments.length - 1] || null;
  }

  function render({ emoji, accent, heading, body, showConfirm }) {
    const card = document.getElementById("card");
    card.innerHTML = `
      <div class="accent-bar ${accent}"></div>
      <div class="emoji">${emoji}</div>
      <h1>${heading}</h1>
      <p>${body}</p>
      ${showConfirm ? '<button id="confirmBtn" type="button">Confirm redemption</button><button id="cancelBtn" type="button" class="secondary">Cancel</button>' : ""}
    `;
    if (showConfirm) {
      document.getElementById("confirmBtn").addEventListener("click", onConfirm);
      document.getElementById("cancelBtn").addEventListener("click", onCancel);
    }
  }

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  let token = null;

  async function onConfirm(e) {
    const btn = e.target;
    const cancelBtn = document.getElementById("cancelBtn");
    btn.disabled = true;
    if (cancelBtn) cancelBtn.disabled = true;
    btn.textContent = "Confirming…";
    try {
      const res = await fetch(`${FUNCTION_BASE}/${encodeURIComponent(token)}`, { method: "POST" });
      const data = await res.json();
      applyResult(data, { isPost: true });
    } catch (err) {
      render({
        emoji: "⚠️",
        accent: "destructive",
        heading: "Something went wrong",
        body: "Couldn't process this redemption. Please try again.",
      });
    }
  }

  function onCancel() {
    // Nothing has been redeemed yet at this point — the POST only fires
    // from onConfirm — so cancelling is just leaving this screen, no
    // rollback needed.
    render({
      emoji: "🚫",
      accent: "muted",
      heading: "Redemption cancelled",
      body: "Nothing was redeemed. You can close this page or scan the code again.",
    });
  }

  function applyResult(data, { isPost }) {
    if (data.status === "ok" && isPost) {
      render({
        emoji: "✅",
        accent: "success",
        heading: "Redeemed!",
        body: `"${escapeHtml(data.title || "")}" has been successfully redeemed. The student has been notified.`,
      });
      return;
    }
    if (data.status === "ok") {
      const business = data.business
        ? `Confirm that ${escapeHtml(data.business)} is handing over this benefit to the student.`
        : "Confirm that you're handing over this benefit to the student.";
      render({
        emoji: "🎁",
        accent: "",
        heading: escapeHtml(data.title || "Benefit"),
        body: business,
        showConfirm: true,
      });
      return;
    }
    if (data.status === "already_redeemed") {
      render({
        emoji: "ℹ️",
        accent: "muted",
        heading: "Already redeemed",
        body: `"${escapeHtml(data.title || "")}" was already redeemed on this card.`,
      });
      return;
    }
    if (data.status === "not_found" || data.status === "invalid") {
      render({
        emoji: "⚠️",
        accent: "destructive",
        heading: "Invalid or unknown code",
        body: "This QR code doesn't match any benefit card.",
      });
      return;
    }
    render({
      emoji: "⚠️",
      accent: "destructive",
      heading: "Something went wrong",
      body: "Couldn't process this redemption. Please try again.",
    });
  }

  async function init() {
    token = tokenFromPath();
    if (!token) {
      render({
        emoji: "⚠️",
        accent: "destructive",
        heading: "Invalid link",
        body: "This redemption link is missing a code.",
      });
      return;
    }
    try {
      const res = await fetch(`${FUNCTION_BASE}/${encodeURIComponent(token)}`, { method: "GET" });
      const data = await res.json();
      applyResult(data, { isPost: false });
    } catch (err) {
      render({
        emoji: "⚠️",
        accent: "destructive",
        heading: "Something went wrong",
        body: "Couldn't reach the server. Check your connection and try again.",
      });
    }
  }

  init();
</script>
</body>
</html>
